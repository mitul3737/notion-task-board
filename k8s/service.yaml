apiVersion: v1
kind: Service
metadata:
  name: task-board
  labels:
    app: task-board        # the ServiceMonitor matches this label
spec:
  selector:
    app: task-board        # finds the Pods
  ports:
    - name: http           # the ServiceMonitor uses this port name
      port: 80
      targetPort: 8000
      protocol: TCP
